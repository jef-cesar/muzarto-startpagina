<style>
  :root{
    --bg1:#fff7ed; --bg2:#eef6ff; --card:rgba(255,255,255,.8); --card-hover:#fff;
    --text:#1f2937; --muted:#6b7280; --border:rgba(31,41,55,.08); --shadow:0 10px 30px rgba(31,41,55,.08);
    --accent:#e8590c; --accent2:#de5833;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#0f172a; --bg2:#1c1917; --card:rgba(30,41,59,.72); --card-hover:rgba(51,65,85,.92);
      --text:#f1f5f9; --muted:#94a3b8; --border:rgba(255,255,255,.08); --shadow:0 10px 30px rgba(0,0,0,.35);
      --accent:#fb923c;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:5vh 16px 32px;
  }
  header{text-align:center;margin-bottom:28px;display:flex;flex-direction:column;align-items:center}
  .brand{
    display:inline-block;padding:14px 26px;border-radius:24px;
    background:rgba(255,255,255,.9);box-shadow:var(--shadow);margin-bottom:26px;
  }
  .brand img{display:block;width:min(300px,70vw);height:auto}
  #clock{font-size:clamp(48px,9vw,84px);font-weight:300;letter-spacing:-2px;line-height:1}
  #date{color:var(--muted);font-size:18px;margin-top:8px}
  #date::first-letter{text-transform:uppercase}
  #greet{font-size:20px;margin-top:12px;font-weight:500}

  form{width:100%;max-width:620px;margin:0 auto 36px}
  .search{
    display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--border);border-radius:999px;padding:6px 8px 6px 14px;
    box-shadow:var(--shadow);backdrop-filter:blur(12px);
  }
  .search .ddg{width:30px;height:30px;flex:none}
  .search input{
    flex:1;border:0;outline:0;background:transparent;color:var(--text);
    font-size:17px;padding:12px 0;min-width:0;
  }
  .search button{
    border:0;border-radius:999px;background:var(--accent2);color:#fff;
    font-size:15px;font-weight:600;padding:11px 20px;cursor:pointer;
  }
  .search button:hover{filter:brightness(1.08)}

  .grid{
    width:100%;max-width:960px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  }
  a.tile{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;
    text-decoration:none;color:var(--text);background:var(--card);
    border:1px solid var(--border);border-radius:20px;padding:24px 14px 18px;
    box-shadow:var(--shadow);backdrop-filter:blur(12px);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  a.tile:hover,a.tile:focus-visible{transform:translateY(-4px);background:var(--card-hover);outline:none;box-shadow:0 16px 40px rgba(232,89,12,.18)}
  .icon{
    width:128px;height:80px;border-radius:16px;display:grid;place-items:center;
    background:#fff;border:1px solid var(--border);overflow:hidden;padding:10px;
  }
  .icon img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .icon.square img{width:56px;height:56px}
  .icon .letter{font-size:30px;font-weight:700;color:#fff;width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
  .name{font-weight:600;font-size:16px;text-align:center}
  .domain{color:var(--muted);font-size:13px;margin-top:-8px;text-align:center;word-break:break-all}
  .key{
    position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted);
    border:1px solid var(--border);border-radius:6px;padding:1px 6px;
  }
  footer{margin-top:auto;padding-top:40px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>

  { name: "Gemeente Kalmthout", url: "https://www.kalmthout.be/",  color: "#15803d" },
  { name: "Intranet Essen",     url: "https://intranet.essen.be/", color: "#1d4ed8",
    logoFrom: "www.essen.be" },
];
const NAAM = "";     // naam in de begroeting (leeg laten = geen naam)
/* ======================================== */

function candidates(l){
  const host = l.logoFrom || new URL(l.url).hostname;
  const list = [];
  if (l.logo) list.push(l.logo);
  list.push(
    `https://${host}/apple-touch-icon.png`,
    `https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${host}&size=128`,
    `https://icons.duckduckgo.com/ip3/${host}.ico`
  );
  return list;
}

function loadLogo(box, l){
  const srcs = candidates(l);
  let i = 0;
  const img = new Image();
  img.alt = "";
  const next = () => {
    if (i >= srcs.length) {
      box.className = "icon";
      box.innerHTML = `<span class="letter" style="background:${l.color || "#e8590c"}">${l.name[0]}</span>`;
      return;
    }
    img.src = srcs[i++];
  };
  img.onload = () => {
    // te kleine / standaard-icoontjes overslaan (behalve eigen logo)
    if (img.naturalWidth < 32 && i < srcs.length) return next();
    box.className = l.wide ? "icon" : "icon square";
    box.replaceChildren(img);
  };
  img.onerror = next;
  next();
}

const grid = document.getElementById("grid");
LINKS.forEach((l, i) => {
  const host = new URL(l.url).hostname;
  const a = document.createElement("a");
  a.className = "tile"; a.href = l.url;
  a.innerHTML = `
    ${i < 9 ? `<span class="key">${i + 1}</span>` : ""}
    <span class="icon"></span>
    <span class="name"></span>
    <span class="domain">${host.replace(/^www\./, "")}</span>`;
  a.querySelector(".name").textContent = l.name;
  loadLogo(a.querySelector(".icon"), l);
  grid.appendChild(a);
});

function tick(){
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("date").textContent =
    d.toLocaleDateString("nl-BE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const h = d.getHours();
  const g = h < 6 ? "Goedenacht" : h < 12 ? "Goedemorgen" : h < 18 ? "Goedemiddag" : "Goedenavond";
  document.getElementById("greet").textContent = NAAM ? `${g}, ${NAAM}` : g;
}
tick(); setInterval(tick, 1000);

const q = document.querySelector('input[name="q"]');
document.addEventListener("keydown", e => {
  if (document.activeElement === q || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= LINKS.length) location.href = LINKS[n - 1].url;
});
</script>
</body>
